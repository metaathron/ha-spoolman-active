name: Bug report
description: Report a bug in the ha-spoolman-active integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible below.

        > **Note on versions:** the `latest` tag/version is **not** the same as the most recently released version. Please provide specific version numbers (e.g. `1.2.3`) for the ha-spoolman-active integration, the Spoolman HA integration, and the Spoolman server — not `latest`.

  - type: input
    id: integration-version
    attributes:
      label: ha-spoolman-active integration version
      description: Specific integration version (not "latest") — see HACS or manifest.json
      placeholder: "e.g. 1.4.0"
    validations:
      required: true

  - type: input
    id: spoolman-integration-version
    attributes:
      label: Spoolman integration version
      description: Version of the installed Spoolman Home Assistant integration this add-on depends on (not "latest")
      placeholder: "e.g. 1.0.2"
    validations:
      required: true

  - type: input
    id: backend-version
    attributes:
      label: Spoolman version
      description: Specific version of the Spoolman server the integration talks to (not "latest")
      placeholder: "e.g. 0.19.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe step by step how to trigger the bug
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the relevant part of the Home Assistant log (Settings > System > Logs)
      render: shell
    validations:
      required: false
